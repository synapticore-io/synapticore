storage:
  storage_path: /qdrant/storage
  optimizers:
    default_segment_number: 2
    memmap_threshold: 20000
    indexing_threshold: 20000
    flush_interval_sec: 30
    max_optimization_threads: 1

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334
  max_request_size_mb: 32

telemetry:
  disabled: false
