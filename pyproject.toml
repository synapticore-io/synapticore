[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapticore"
version = "0.1.0"
description = "A hierarchical agent manager for orchestrating LLM-based agents"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.4",
    "langchain-anthropic>=0.0.6",
    "langchain-community>=0.0.16",
    "langgraph>=0.0.20",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.11",
    "uvicorn>=0.34.0",
    "langchain-redis>=0.2.0",
    "langchain-qdrant>=0.2.0",
    "langchain-mongodb>=0.5.0",
    "langfuse>=2.59.7",
    "langgraph-supervisor>=0.0.8",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "mkdocs-material>=9.5.21",
    "mkdocstrings[python]>=0.25.2",
]
openai = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.5.0",
]

all = [
    "openai>=1.0.0",
    "anthropic>=0.5.0",
    "aiohttp>=3.8.0",
    "pytest>=7.0.0",
    "pytest-cov",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "mkdocs-material>=9.5.21",
    "mkdocstrings[python]>=0.25.2",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.pytest.ini_options]
addopts = "--cov=./ --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "tests.py"]

[tool.mkdocs]
site_name = "Synapticore Documentation"
site_description = "Documentation for the Synapticore framework"
nav = [
    "Home: index.md",
    "API Reference: api.md",
    "Tutorials: tutorials.md",
]
theme = "material"
plugins = [
    "mkdocstrings",
]

[tool.mkdocstrings]
handlers = { python = { options = { docstring_style = "google", show_root_heading = true, show_source = true } } }
