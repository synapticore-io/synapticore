version: '3.8'

networks:
  synapticore-network:
    driver: bridge

volumes:
  vault_data:
  vault_logs:
  vault_tls:
  vault_transit_data:
  vault_transit_logs:
  vault_transit_tls:
  redis_data:
  mongodb_data:
  mongodb_configdb:
  mongodb_logs:
  qdrant_storage:
  qdrant_tls:
  prometheus_data:
  backup_data:
  backup_storage:

services:
  # Vault für Secret Management
  vault:
    build:
      context: ./services/vault
    container_name: vault
    ports:
      - "8200:8200"
      - "8201:8201"
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - vault_tls:/vault/tls
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=https://127.0.0.1:8200
      - VAULT_API_ADDR=https://0.0.0.0:8200
    networks:
      - synapticore-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Vault Transit für Verschlüsselungsoperationen
  vault-transit:
    build:
      context: ./services/vault
    container_name: vault-transit
    ports:
      - "8210:8200"
    volumes:
      - vault_transit_data:/vault/data
      - vault_transit_logs:/vault/logs
      - vault_transit_tls:/vault/tls
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=https://127.0.0.1:8200
      - VAULT_API_ADDR=https://0.0.0.0:8200
      - VAULT_TRANSIT_SERVER=true
    networks:
      - synapticore-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis für Caching
  redis:
    build:
      context: ./services/redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_SKIP_VERIFY=true
    networks:
      - synapticore-network
    depends_on:
      - vault
    restart: unless-stopped

  # MongoDB für persistente Daten
  mongodb:
    build:
      context: ./services/mongodb
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_configdb:/data/configdb
      - mongodb_logs:/var/log/mongodb
    networks:
      - synapticore-network
    restart: unless-stopped

  # Qdrant für Vektorsuche
  qdrant:
    build:
      context: ./services/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_tls:/qdrant/tls
    environment:
      - QDRANT_ALLOW_RECOVERY_MODE=true
    networks:
      - synapticore-network
    restart: unless-stopped

  # Prometheus für Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./services/prometheus/config:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - synapticore-network
    restart: unless-stopped

  # Backup Manager für automatisierte Backups
  backup-manager:
    build:
      context: ./services/backup-manager
    container_name: backup-manager
    volumes:
      - backup_data:/backup-data
      - backup_storage:/backup
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_SKIP_VERIFY=true
      - BACKUP_RETENTION_DAYS=14
      - RUN_INITIAL_BACKUP=false
      - REMOTE_BACKUP=false
    networks:
      - synapticore-network
    depends_on:
      - vault
      - redis
      - mongodb
      - qdrant
    restart: unless-stopped
