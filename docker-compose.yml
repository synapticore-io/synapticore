version: '3.8'

services:
  vault:
    build: ./services/vault
    container_name: vault
    ports:
      - "8200:8200"
      - "8201:8201"
    volumes:
      - ./services/vault/data:/vault/data
      - ./services/vault/logs:/vault/logs
      - ./services/vault/config:/vault/config
      - ./services/vault/tls:/vault/tls:ro
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=https://0.0.0.0:8200
    restart: unless-stopped
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
      replicas: 1
      update_config:
        parallelism: 1
        delay: 60s

  redis:
    build: ./services/redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./services/redis/data:/data
      - ./services/redis/config:/usr/local/etc/redis
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    secrets:
      - redis_password
    environment:
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password

  qdrant:
    build: ./services/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./services/qdrant/data:/qdrant/storage
    restart: unless-stopped
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  mongodb:
    build: ./services/mongodb
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./services/mongodb/data:/data/db
      - ./services/mongodb/config:/etc/mongo
      - ./services/mongodb/logs:/var/log/mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongo_root_password
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    secrets:
      - mongo_root_password

  prometheus:
    image: prom/prometheus:v2.43.0
    container_name: prometheus
    volumes:
      - ./services/prometheus/config:/etc/prometheus
      - ./services/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  grafana:
    image: grafana/grafana:9.5.1
    container_name: grafana
    volumes:
      - ./services/grafana/data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    secrets:
      - grafana_admin_password

  backup-manager:
    build:
      context: ./services/backup-manager
      dockerfile: Dockerfile
    container_name: backup-manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./services/backup-manager/scripts:/scripts
      - ./services/backup-manager/data:/backup-data
      - /backup:/backup
      - ./services/secrets:/secrets:ro
    environment:
      - BACKUP_RETENTION_DAYS=14
      - ENCRYPTION_KEY_FILE=/secrets/backup_encryption_key.txt
      - REMOTE_BACKUP=false
      - S3_BUCKET=your-backup-bucket
      - AWS_REGION=eu-central-1
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

secrets:
  mongo_root_password:
    file: ./services/secrets/mongo_root_password.txt
  redis_password:
    file: ./services/secrets/redis_password.txt
  grafana_admin_password:
    file: ./services/secrets/grafana_admin_password.txt

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
