version: '3.8'

services:
  vault:
    build: ./services/vault
    container_name: vault
    ports:
      - "8200:8200"
      - "8201:8201"
    volumes:
      - vault-data:/vault/data
      - ./services/vault/logs:/vault/logs
      - ./services/vault/config:/vault/config
      - ./services/vault/tls:/vault/tls:ro
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=https://0.0.0.0:8200
    restart: unless-stopped
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
      replicas: 1
      update_config:
        parallelism: 1
        delay: 60s

  redis:
    build: ./services/redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./services/redis/config:/usr/local/etc/redis
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_SKIP_VERIFY=true
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    depends_on:
      vault:
        condition: service_healthy

  qdrant:
    build: ./services/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  mongodb:
    build: ./services/mongodb
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./services/mongodb/config:/etc/mongo
      - ./services/mongodb/logs:/var/log/mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=changeme # Will be replaced by automation after vault is initialized
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    depends_on:
      vault:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.43.0
    container_name: prometheus
    volumes:
      - ./services/prometheus/config:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  grafana:
    image: grafana/grafana:9.5.1
    container_name: grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin  # Will be replaced by automation
      - GF_USERS_ALLOW_SIGN_UP=false
      - VAULT_ADDR=https://vault:8200
      - VAULT_SKIP_VERIFY=true
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    depends_on:
      vault:
        condition: service_healthy

  backup-manager:
    build:
      context: ./services/backup-manager
      dockerfile: Dockerfile
    container_name: backup-manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./services/backup-manager/scripts:/scripts
      - backup-data:/backup-data
      - backup-volume:/backup
    environment:
      - BACKUP_RETENTION_DAYS=14
      - REMOTE_BACKUP=false
      - S3_BUCKET=your-backup-bucket
      - AWS_REGION=eu-central-1
      - VAULT_ADDR=https://vault:8200
      - VAULT_SKIP_VERIFY=true
      - RUN_INITIAL_BACKUP=false
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      vault:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  vault-data:
  redis-data:
  mongodb-data:
  qdrant-data:
  prometheus-data:
  grafana-data:
  backup-data:
  backup-volume:
